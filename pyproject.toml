[project]
name = "mender"
version = "0.1.0"
description = "Mender: Kubernetes Incident-to-Fix Agent"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords = [
    "kubernetes",
    "nemotron",
    "nebius",
    "tavily",
    "ai-agent",
    "root-cause-analysis",
    "devops",
    "sre",
]
authors = [{ name = "Mender contributors" }]
dependencies = [
    "openai>=1.60",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/yablokolabs/mender"
Repository = "https://github.com/yablokolabs/mender"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src/mender", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
